<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="Arial, sans-serif" font-size="12">
  <defs>
    <marker id="tri" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#fff" stroke="#333"/></marker>
    <marker id="dia" markerWidth="14" markerHeight="10" refX="1" refY="5" orient="auto"><path d="M0,5 L7,0 L14,5 L7,10 z" fill="#fff" stroke="#333"/></marker>
  </defs>
  <rect width="1100" height="700" fill="#fff"/>
  <text x="550" y="26" text-anchor="middle" font-size="16" font-weight="bold">Bridge: табло рейсів і обладнання відображення</text>

  <!-- FlightBoard -->
  <rect x="30" y="50" width="330" height="170" fill="#e8f0fe" stroke="#333"/>
  <text x="195" y="70" text-anchor="middle" font-style="italic">«Abstraction»</text>
  <text x="195" y="88" text-anchor="middle" font-weight="bold">FlightBoard (abstract)</text>
  <line x1="30" y1="96" x2="360" y2="96" stroke="#333"/>
  <text x="40" y="114"># device : DisplayDevice</text>
  <text x="40" y="130"># flights : List&lt;Flight&gt;</text>
  <line x1="30" y1="138" x2="360" y2="138" stroke="#333"/>
  <text x="40" y="154">+ setDevice(device) : void</text>
  <text x="40" y="170">+ getDevice() : DisplayDevice</text>
  <text x="40" y="186">+ show() : void</text>
  <text x="40" y="202"># {abstract} getTitle() : String</text>
  <text x="40" y="216"># {abstract} buildLines() : List&lt;String&gt;</text>

  <!-- Refined -->
  <g>
    <rect x="30" y="320" width="100" height="90" fill="#e8f0fe" stroke="#333"/>
    <text x="80" y="338" text-anchor="middle" font-size="10" font-style="italic">«RefinedAbstraction»</text>
    <text x="80" y="356" text-anchor="middle" font-weight="bold">DepartureBoard</text>
    <line x1="30" y1="364" x2="130" y2="364" stroke="#333"/>
    <text x="34" y="380"># getTitle()</text>
    <text x="34" y="396"># buildLines()</text>

    <rect x="150" y="320" width="100" height="90" fill="#e8f0fe" stroke="#333"/>
    <text x="200" y="338" text-anchor="middle" font-size="10" font-style="italic">«RefinedAbstraction»</text>
    <text x="200" y="356" text-anchor="middle" font-weight="bold">ArrivalBoard</text>
    <line x1="150" y1="364" x2="250" y2="364" stroke="#333"/>
    <text x="154" y="380"># getTitle()</text>
    <text x="154" y="396"># buildLines()</text>

    <rect x="270" y="320" width="100" height="90" fill="#e8f0fe" stroke="#333"/>
    <text x="320" y="338" text-anchor="middle" font-size="10" font-style="italic">«RefinedAbstraction»</text>
    <text x="320" y="356" text-anchor="middle" font-weight="bold">GateBoard</text>
    <line x1="270" y1="364" x2="370" y2="364" stroke="#333"/>
    <text x="274" y="380"># getTitle()</text>
    <text x="274" y="396"># buildLines()</text>
  </g>
  <!-- generalization lines -->
  <line x1="195" y1="320" x2="195" y2="290" stroke="#333"/>
  <line x1="80" y1="290" x2="320" y2="290" stroke="#333"/>
  <line x1="80" y1="290" x2="80" y2="320" stroke="#333"/>
  <line x1="320" y1="290" x2="320" y2="320" stroke="#333"/>
  <line x1="195" y1="290" x2="195" y2="221" stroke="#333" marker-end="url(#tri)"/>

  <!-- DisplayDevice -->
  <rect x="640" y="70" width="260" height="90" fill="#fff4e0" stroke="#333"/>
  <text x="770" y="90" text-anchor="middle" font-style="italic">«Implementor»</text>
  <text x="770" y="108" text-anchor="middle" font-weight="bold">«interface» DisplayDevice</text>
  <line x1="640" y1="116" x2="900" y2="116" stroke="#333"/>
  <text x="650" y="134">+ getName() : String</text>
  <text x="650" y="150">+ render(title, lines) : void</text>

  <!-- Bridge association -->
  <line x1="360" y1="110" x2="640" y2="110" stroke="#333" marker-start="url(#dia)"/>
  <text x="500" y="102" text-anchor="middle">device (міст)</text>
  <text x="372" y="126">*</text>
  <text x="620" y="126">1</text>

  <!-- Concrete implementors -->
  <g fill="#fff4e0" stroke="#333">
    <rect x="450" y="320" width="130" height="70"/>
    <rect x="600" y="320" width="130" height="70"/>
    <rect x="750" y="320" width="130" height="70"/>
    <rect x="900" y="320" width="150" height="70" stroke-dasharray="5,3"/>
  </g>
  <g text-anchor="middle">
    <text x="515" y="338" font-size="10" font-style="italic">«ConcreteImplementor»</text>
    <text x="515" y="356" font-weight="bold">LedPanel</text>
    <text x="515" y="376">+ render(title, lines)</text>
    <text x="665" y="338" font-size="10" font-style="italic">«ConcreteImplementor»</text>
    <text x="665" y="356" font-weight="bold">LcdScreen</text>
    <text x="665" y="376">+ render(title, lines)</text>
    <text x="815" y="338" font-size="10" font-style="italic">«ConcreteImplementor»</text>
    <text x="815" y="356" font-weight="bold">MobileApp</text>
    <text x="815" y="376">+ render(title, lines)</text>
    <text x="975" y="338" font-size="10" font-style="italic">«ConcreteImplementor»</text>
    <text x="975" y="356" font-weight="bold">Projector (новий)</text>
    <text x="975" y="376">+ render(title, lines)</text>
  </g>
  <!-- realization lines (dashed) -->
  <g stroke="#333" stroke-dasharray="5,3" fill="none">
    <line x1="515" y1="320" x2="515" y2="260"/>
    <line x1="665" y1="320" x2="665" y2="260"/>
    <line x1="815" y1="320" x2="815" y2="260"/>
    <line x1="975" y1="320" x2="975" y2="260"/>
    <line x1="515" y1="260" x2="975" y2="260"/>
    <line x1="770" y1="260" x2="770" y2="161" marker-end="url(#tri)"/>
  </g>

  <!-- Flight -->
  <rect x="30" y="470" width="260" height="130" fill="#f3f3f3" stroke="#333"/>
  <text x="160" y="490" text-anchor="middle" font-style="italic">«record»</text>
  <text x="160" y="506" text-anchor="middle" font-weight="bold">Flight</text>
  <line x1="30" y1="514" x2="290" y2="514" stroke="#333"/>
  <text x="40" y="532">- code : String</text>
  <text x="40" y="548">- city : String</text>
  <text x="40" y="564">- time : String</text>
  <text x="40" y="580">- gate : String</text>
  <text x="40" y="594">- status : String</text>
  <path d="M 30 135 L 14 135 L 14 535 L 30 535" stroke="#333" fill="none" marker-start="url(#dia)"/>
  <text x="18" y="130">1</text>
  <text x="18" y="528">0..*</text>
  <text x="40" y="620" font-size="11">flights (агрегація)</text>

  <text x="540" y="470" font-size="12">Нове обладнання = 1 новий клас-реалізація DisplayDevice;</text>
  <text x="540" y="488" font-size="12">новий вид табло = 1 новий підклас FlightBoard.</text>
  <text x="540" y="506" font-size="12">Комбінації вид × обладнання задаються під час виконання (setDevice).</text>
</svg>
